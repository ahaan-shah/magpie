[package]
name = "magpie-core"
description = "Engine behind the Magpie finance tracker: money, SQLite store, analytics, budgets, recurring, FX"
keywords = ["finance", "budget", "money", "ledger"]
categories = ["finance"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "1.8.7"
calamine = "0.36.1"
csv = "1.4.0"
directories = "6.0.0"
encoding_rs = "0.8.42"
jiff = "0.2.37"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"
