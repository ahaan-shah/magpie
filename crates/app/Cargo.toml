[package]
name = "magpie-finance"
description = "Magpie — a fast, beautiful, local-first personal finance tracker"
readme = "../../README.md"
keywords = ["finance", "budget", "expenses", "money", "egui"]
categories = ["finance", "gui"]
default-run = "magpie"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.37"
magpie-core = { version = "0.1.0", path = "../core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
