[package]
name = "magpie-finance"
description = "Magpie — a fast, beautiful, local-first personal finance tracker"
readme = "../../README.md"
keywords = ["finance", "budget", "expenses", "money", "egui"]
categories = ["finance", "gui"]
default-run = "magpie"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

build = "build.rs"

[[bin]]
name = "magpie"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36.2"
egui-phosphor = "0.14.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.37"
magpie-core = { version = "0.2.5", path = "../core" }
pollster = "1.0.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

# Windows: glow (OpenGL) first, with wgpu (Direct3D 12, including its software
# rasterizer) as the fallback for machines without a usable OpenGL driver:
# VMs, remote desktop, some older laptops.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wgpu", "default_fonts", "persistence"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
egui-wgpu = "0.36"
