[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
authors = ["Ahaan Shah"]
repository = "https://github.com/ahaan-shah/magpie"
homepage = "https://github.com/ahaan-shah/magpie"
rust-version = "1.88"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# Release artifacts (built by scripts/package-linux.sh and bundle-macos.sh).
[profile.dist]
inherits = "release"

# Optimized but quick to build, for day-to-day iteration:
#   cargo run --profile fast -- --demo
[profile.fast]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = false
panic = "unwind"
