name: Release

# Push a tag like v0.1.0 to build and publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Running it by hand (workflow_dispatch) builds and tests everything,
# including the Windows installer smoke test, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux-${{ matrix.target }}
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - run: ./scripts/package-linux.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*.tar.gz

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Magpie-macos-universal.dmg
            dist/Magpie-macos-universal.zip

  windows:
    # Windows ships from 0.2.0; 0.1.x releases are Linux and macOS only.
    if: ${{ !startsWith(github.ref_name, 'v0.1.') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build zips and installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 "${{ github.ref_name }}"
      - name: Smoke test (install, run, screenshot every page, uninstall)
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 dist/Magpie-windows-setup.exe windows-screenshots
      - name: Zips hold magpie.exe at the root (the in-app updater expects it)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($arch in 'x64', 'arm64') {
            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist/Magpie-windows-$arch.zip"))
            $names = @($zip.Entries.FullName); $zip.Dispose()
            Write-Host "${arch}: $($names -join ', ')"
            if ($names -notcontains 'magpie.exe') { throw "magpie.exe isn't at the root of the $arch zip" }
          }
      - name: install.ps1 one-liner (Windows PowerShell 5.1, local mirror)
        shell: pwsh
        run: |
          $mirror = Join-Path $env:RUNNER_TEMP 'mirror'
          New-Item -ItemType Directory -Force $mirror | Out-Null
          Copy-Item dist/Magpie-windows-setup.exe, install.ps1 $mirror
          $hash = (Get-FileHash "$mirror/Magpie-windows-setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Magpie-windows-setup.exe" | Set-Content "$mirror/SHA256SUMS"
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -WorkingDirectory $mirror -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/SHA256SUMS | Out-Null; break } catch { Start-Sleep 1 }
            }
            $env:MAGPIE_BASE_URL = 'http://127.0.0.1:8765'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command 'irm http://127.0.0.1:8765/install.ps1 | iex'
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed ($LASTEXITCODE)" }
            $exe = Join-Path $env:LOCALAPPDATA 'Programs\Magpie\magpie.exe'
            if (-not (Test-Path $exe)) { throw "install.ps1 didn't install $exe" }
            $out = Join-Path $env:RUNNER_TEMP 'version.txt'
            Start-Process $exe -ArgumentList '--version' -Wait -NoNewWindow -RedirectStandardOutput $out
            $version = (Get-Content $out -Raw).Trim()
            Write-Host "installed: $version"
            if ($version -notmatch '^magpie \d+\.\d+\.\d+$') { throw "--version failed: '$version'" }
            if (-not (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Magpie.lnk'))) { throw "no Start menu shortcut" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: windows-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Magpie-windows-setup.exe
            dist/Magpie-windows-x64.zip
            dist/Magpie-windows-arm64.zip

  publish:
    needs: [linux, macos, windows]
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v')
      && needs.linux.result == 'success' && needs.macos.result == 'success'
      && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linux-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: artifacts
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: windows
          path: artifacts
      - name: Checksums
        run: |
          cp install.sh artifacts/
          if ls artifacts/Magpie-windows-* >/dev/null 2>&1; then cp install.ps1 artifacts/; fi
          cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Magpie $version" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          draft: false
